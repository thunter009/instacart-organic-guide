<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Organic Shopping Guide</h1>
      <!-- Cart audit is built and message-wired but its cart-drawer detection
           does not match Instacart's real DOM yet, so the button is withheld
           rather than shipped broken. See tools/cart-probe.js. -->
      <div class="actions">
        <button id="scan-page">Scan this page</button>
      </div>
    </header>

    <label class="toggle">
      <input type="checkbox" id="hide-mode" />
      <span>Hide conventional Dirty Dozen items entirely<em>Off = grey them out but keep them visible.</em></span>
    </label>

    <div id="stale" class="stale" hidden></div>
    <div id="status" class="status"></div>
    <div id="results"></div>

    <footer>
      <span id="updated"></span>
      <a href="https://www.ewg.org/foodnews/" target="_blank" rel="noreferrer">EWG source</a>
    </footer>

    <script src="../data/produce.js"></script>
    <script src="../lib/match.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
